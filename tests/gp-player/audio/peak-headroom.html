<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>gp-player peak headroom</title></head>
<body>
<div id="out">running</div>
<script type="module">
import { writeln, printTable, reportResult, runMain } from './harness.js';
import { createVoiceFactory } from '../../../js/gpPlayer/instrumentVoices.js';
import {
  attachMixGraph,
  getTrackBus,
  getSafetyPeakLinear,
  measureProtectedPeak,
} from '../../../js/audio/mixBus.js';

const CHORD_MIDIS = [40, 43, 47, 50, 54, 57];
const NOTE_DUR = 0.35;
const RENDER_SEC = 0.6;
const SAMPLE_RATE = 48000;
const CHORD_SIZE = CHORD_MIDIS.length;

async function renderPeak(masterVolume) {
  const length = Math.ceil(RENDER_SEC * SAMPLE_RATE);
  const ctx = new OfflineAudioContext({ numberOfChannels: 2, length, sampleRate: SAMPLE_RATE });
  attachMixGraph(ctx, { masterVolume });
  const factory = createVoiceFactory(ctx);
  const dest = getTrackBus('guitar:0', { volume: 1, pan: 0 }) || ctx.destination;

  const when = 0.05;
  for (const midi of CHORD_MIDIS) {
    factory.playNote({
      family: 'cleanGuitar',
      midi,
      when,
      durSec: NOTE_DUR,
      velocity: 0.95,
      techniques: [],
      bend: null,
      slideKind: null,
      chordSize: CHORD_SIZE,
      destination: dest,
    });
  }

  const buffer = await ctx.startRendering();
  let peak = 0;
  for (let c = 0; c < buffer.numberOfChannels; c += 1) {
    peak = Math.max(peak, measureProtectedPeak({
      numberOfChannels: 1,
      getChannelData: () => buffer.getChannelData(c),
    }));
  }
  return peak;
}

runMain(async () => {
  const limit = getSafetyPeakLinear();
  writeln('peak-headroom: shared mix safety stage');
  writeln(`peak limit linear: ${limit}`);

  const peak1 = await renderPeak(1);
  const peak2 = await renderPeak(1.5);
  const pass1 = peak1 <= limit + 1e-6;
  const pass2 = peak2 <= limit + 1e-6;
  const pass = pass1 && pass2;

  printTable([
    {
      metric: 'peak_linear_master_1',
      value: peak1.toFixed(4),
      limit: `<= ${limit.toFixed(4)}`,
      ok: pass1 ? 'yes' : 'no',
    },
    {
      metric: 'peak_linear_master_1_5',
      value: peak2.toFixed(4),
      limit: `<= ${limit.toFixed(4)}`,
      ok: pass2 ? 'yes' : 'no',
    },
  ], [
    { key: 'metric', label: 'metric' },
    { key: 'value', label: 'value' },
    { key: 'limit', label: 'limit' },
    { key: 'ok', label: 'ok' },
  ]);

  writeln(`peak_linear master 1: ${peak1.toFixed(6)}`);
  writeln(`peak_linear master 1.5: ${peak2.toFixed(6)}`);
  reportResult(pass);
});
</script>
</body>
</html>
