<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>gp-player core pack load</title></head>
<body>
<div id="out">running</div>
<script type="module">
import { writeln, reportResult, runMain } from './harness.js';
import { registerCorePacks } from '../../../js/audio/packCatalog.js';
import {
  loadPacksForScore,
  getPlaybackSourceState,
  packBufferKey,
} from '../../../js/audio/sampleLoader.js';
import { getPack } from '../../../js/audio/samplePackRegistry.js';
import { pickPitchedSample } from '../../../js/audio/sampleVoice.js';

runMain(async () => {
  writeln('core-pack-load: register and decode core-guitar');

  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (typeof Ctx !== 'function') {
    throw new Error('OfflineAudioContext is missing.');
  }
  const ctx = new Ctx(1, 44100, 44100);

  const reg = await registerCorePacks();
  writeln(`registered: ${reg.registered.join(',')}`);
  if (!reg.registered.includes('core-guitar')) {
    throw new Error('core-guitar did not register.');
  }

  const result = await loadPacksForScore({
    scoreId: 'core-real',
    programs: [27],
    drumNotes: [36],
    audioCtx: ctx,
  });
  writeln(`load status: ${result.status}`);
  if (result.status !== 'ready') {
    throw new Error(`expected ready, got ${result.status}: ${result.error || ''}`);
  }

  const label = getPlaybackSourceState('core-real');
  writeln(`label: ${label}`);
  if (label !== 'Studio ready') {
    throw new Error(`expected Studio ready, got ${label}`);
  }

  const manifest = getPack('core-guitar');
  const sample = pickPitchedSample(manifest, 40, 0.8);
  const key = packBufferKey('core-guitar', sample.file);
  if (!result.buffers[key]) {
    throw new Error(`missing buffer ${key}`);
  }
  writeln(`decoded ${key} duration=${result.buffers[key].duration}`);

  reportResult(true, 'core pack load ready');
});
</script>
</body>
</html>
